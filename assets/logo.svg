      <stop offset="0" stop-color="#232847"/>
      <stop offset="1" stop-color="#12152B"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
