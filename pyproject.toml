[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pismith"
version = "0.3.0"
description = "pismith — all-in-one toolkit: databases + data analysis + ML/DL experiments + LLM observability (langsmith-compatible, local-first, zero required deps)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "salim-studio" }]
dependencies = []
keywords = ["langsmith", "tracing", "evaluation", "llm", "observability", "fast", "database", "sqlite", "postgres", "data-analysis", "pandas", "machine-learning", "deep-learning", "mlflow", "etl", "metrics"]

[project.urls]
Homepage = "https://github.com/salim-studio/pismith"
Repository = "https://github.com/salim-studio/pismith"
Issues = "https://github.com/salim-studio/pismith/issues"

[project.optional-dependencies]
fast = ["orjson"]
test = ["pytest"]
all = ["orjson", "pytest"]

[tool.setuptools.packages.find]
include = ["pismith*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
